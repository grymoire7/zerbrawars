<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zebra Wars</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--zw-bg, #15171c);
        color: var(--zw-text, #e8eaf0);
        font: 14px sans-serif;
      }
      button {
        font: inherit;
        color: var(--zw-text, #e8eaf0);
        background: var(--zw-control, #2d3340);
        border: 1px solid var(--zw-line-strong, #4a5263);
        border-radius: 6px;
      }
      button:hover:not(:disabled) {
        background: var(--zw-control-hover, #3a4150);
      }
      button:disabled {
        opacity: 0.45;
      }
      button:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--zw-focus, #9fd8f0);
        outline-offset: 2px;
      }
      /* Narrow or portrait: board on top, panels below, controls pinned at the bottom. */
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      #board {
        position: relative;
        flex: 0 0 48%;
        min-height: 300px;
        min-width: 0;
      }
      /* Life phase: the calendar needs the room, so the body inset shrinks on a phone. */
      #app.life #board {
        flex-basis: 30%;
        min-height: 190px;
      }
      #scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #side {
        flex: 1 1 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: var(--zw-surface, #1f232b);
        border-top: 1px solid var(--zw-line, #3a4150);
      }
      #sideScroll {
        flex: 1 1 0;
        min-height: 0;
        overflow-y: auto;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #bar {
        flex: none;
        padding: 8px;
        background: var(--zw-bg, #15171c);
        border-top: 1px solid var(--zw-line, #3a4150);
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      /* Wide or landscape: board left, fixed side panel right. */
      @media (min-width: 900px), (min-aspect-ratio: 5/4) {
        #app {
          flex-direction: row;
        }
        #board,
        #app.life #board {
          flex: 1 1 0;
          min-height: 0;
        }
        #side {
          flex: 0 0 clamp(300px, 28vw, 360px);
          border-top: 0;
          border-left: 1px solid var(--zw-line, #3a4150);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="board"><canvas id="scene"></canvas></div>
      <aside id="side" aria-label="Orders and information">
        <div id="sideScroll"></div>
        <div id="bar"></div>
      </aside>
    </div>
    <div id="ui"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
