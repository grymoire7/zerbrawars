<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zebra Wars</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--zw-bg, #15171c);
        color: var(--zw-text, #e8eaf0);
        font: 14px sans-serif;
      }
      button {
        font: inherit;
        color: var(--zw-text, #e8eaf0);
        background: var(--zw-control, #2d3340);
        border: 1px solid var(--zw-line-strong, #4a5263);
        border-radius: 6px;
      }
      button:hover:not(:disabled) {
        background: var(--zw-control-hover, #3a4150);
      }
      button:disabled {
        opacity: 0.45;
      }
      button:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--zw-focus, #9fd8f0);
        outline-offset: 2px;
      }
      /* Narrow or portrait: board on top, panels below, controls pinned at the bottom. */
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
        height: 100dvh;
      }
      #board {
        position: relative;
        flex: 0 0 48%;
        min-height: 300px;
        min-width: 0;
      }
      /* Life phase: the calendar needs the room, so the body inset shrinks on a phone. */
      #app.life #board {
        flex-basis: 30%;
        min-height: 190px;
      }
      #scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #side {
        flex: 1 1 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: var(--zw-surface, #1f232b);
        border-top: 1px solid var(--zw-line, #3a4150);
      }
      /* Coach strip (Arc 1 only): one line above the status strip; empty means hidden. */
      #coach {
        flex: none;
        z-index: 2;
        box-sizing: border-box;
        padding: 4px 8px;
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--zw-info-bg, #2a3140);
        border-bottom: 1px solid var(--zw-line, #3a4150);
      }
      #coach:empty {
        display: none;
      }
      .zw-coach-text {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 13px;
        line-height: 1.3;
        color: var(--zw-text, #e8eaf0);
      }
      .zw-coach-got {
        flex: none;
        min-width: 44px;
        min-height: 44px;
        padding: 0 10px;
      }
      /* A control the coach points at: a static outline, pulsing only if motion is welcome. */
      .zw-coach-pulse {
        outline: 2px solid var(--zw-focus, #9fd8f0);
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: no-preference) {
        .zw-coach-pulse {
          animation: zw-coach-pulse 1.2s ease-in-out infinite;
        }
      }
      @keyframes zw-coach-pulse {
        50% {
          outline-color: transparent;
          outline-offset: 5px;
        }
      }
      /* Status strip: pinned at the top of the side panel while #sideScroll scrolls; never on the board. */
      #status {
        flex: none;
        position: sticky;
        top: 0;
        z-index: 2;
        padding: 6px 8px;
        background: var(--zw-surface, #1f232b);
        container-type: inline-size;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #status:empty {
        display: none;
      }
      .zw-status-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
      }
      .zw-status-grid[data-cols="3"] {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .zw-status-grid[data-cols="5"] {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
      .zw-label-short {
        display: none;
      }
      /* The strip's own width decides, so the desktop side panel gets the short labels too. */
      @container (max-width: 420px) {
        .zw-label-full {
          display: none;
        }
        .zw-label-short {
          display: inline;
        }
      }
      @media (max-width: 339px) {
        .zw-status-grid[data-cols] {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      .zw-cell {
        min-height: 44px;
        min-width: 0;
        box-sizing: border-box;
        padding: 3px 5px 5px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 2px;
        text-align: left;
        background: var(--zw-raised, #272c36);
        border: 1px solid var(--zw-line, #3a4150);
        border-radius: 6px;
      }
      .zw-cell[aria-pressed="true"] {
        border-color: var(--zw-focus, #9fd8f0);
      }
      .zw-cell-label {
        font-size: 12px;
        line-height: 1.2;
        color: var(--zw-text-muted, #a9b0bd);
      }
      .zw-cell-value {
        font-size: 13px;
        line-height: 1.2;
        color: var(--zw-text, #e8eaf0);
      }
      .zw-cell-state {
        font-weight: 600;
      }
      .zw-tip-btn {
        flex: none;
        min-width: 44px;
        min-height: 44px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: 0;
        color: inherit;
        cursor: pointer;
      }
      .zw-tip-dot {
        width: 22px;
        height: 22px;
        box-sizing: border-box;
        border: 1.5px solid var(--zw-text-muted, #a9b0bd);
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 700;
        line-height: 1;
      }
      .zw-tip-btn[aria-expanded="true"] .zw-tip-dot {
        border-color: var(--zw-focus, #9fd8f0);
        background: var(--zw-control, #323846);
      }
      .zw-tip-note {
        font-size: 13px;
        line-height: 1.35;
        padding: 6px 8px;
        border-radius: 6px;
        background: var(--zw-info-bg, #2a3140);
        color: var(--zw-text, #e8eaf0);
      }
      .zw-tip-note[hidden] {
        display: none;
      }
      .zw-bar {
        position: relative;
        flex: none;
        height: 6px;
        border-radius: 3px;
        background: var(--zw-line, #3a4150);
        overflow: hidden;
      }
      .zw-bar-ghost,
      .zw-bar-solid {
        position: absolute;
        inset: 0 auto 0 0;
      }
      /* Hatched, so a preview never relies on a paler colour alone. */
      .zw-bar-ghost {
        opacity: 0.8;
        background-image: repeating-linear-gradient(
          135deg,
          transparent 0 2px,
          var(--zw-line, #3a4150) 2px 4px
        );
      }
      .zw-bar-notch {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--zw-text, #e8eaf0);
      }
      .zw-bar-segments {
        display: flex;
        gap: 2px;
        background: none;
        border-radius: 0;
        overflow: visible;
      }
      .zw-seg {
        flex: 1 1 0;
        border-radius: 2px;
        background: var(--zw-line, #3a4150);
      }
      .zw-seg-solid {
        background: var(--zw-seg);
      }
      .zw-seg-ghost {
        background: var(--zw-seg);
        opacity: 0.35;
        outline: 1px dashed var(--zw-seg);
        outline-offset: -1px;
      }
      .zw-status-info {
        font-size: 13px;
        line-height: 1.3;
        color: var(--zw-text, #e8eaf0);
      }
      #sideScroll {
        flex: 1 1 0;
        min-height: 0;
        overflow-y: auto;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      /* Scroll affordance: scrollbars on touch phones are overlay and hide, so a soft glow shows at
         the bottom edge while there is more below. It is scroll-linked (not motion) and fades out at the
         end of the content; where scroll timelines are unsupported it is simply absent. */
      #sideScroll,
      #app.life #side {
        scrollbar-width: thin;
        scrollbar-color: var(--zw-text-muted, #8b93a3) transparent;
      }
      #sideScroll::after,
      #app.life #side::after {
        content: "";
        display: none;
        flex: none;
        position: sticky;
        bottom: 0;
        box-sizing: border-box;
        height: 30px;
        margin-top: -38px; /* cancels its own height and the 8px flex gap, so it adds no scroll length */
        pointer-events: none;
        z-index: 1;
        opacity: 0;
        /* A pink glow (the board's healthy-tissue colour) with a thin line at the edge: a dark shadow
           vanishes against the dark panel. rgba first for browsers without color-mix. */
        background: linear-gradient(transparent, rgba(255, 140, 189, 0.38));
        background: linear-gradient(
          transparent,
          color-mix(in srgb, var(--zw-region-lung, #ff8cbd) 38%, transparent)
        );
        border-bottom: 2px solid rgba(255, 140, 189, 0.75);
        border-bottom-color: color-mix(
          in srgb,
          var(--zw-region-lung, #ff8cbd) 75%,
          transparent
        );
      }
      /* #sideScroll has 8px of padding and a sticky box stops at the padding edge, so push it flush
         with the bottom of the scrollport or content shows through underneath. */
      #sideScroll::after {
        bottom: -8px;
      }
      @supports (animation-timeline: scroll()) {
        #sideScroll::after {
          display: block;
          animation: zw-scroll-more linear both;
          animation-timeline: scroll(nearest);
        }
      }
      @keyframes zw-scroll-more {
        0%,
        85% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      #bar {
        flex: none;
        padding: 8px 8px max(8px, env(safe-area-inset-bottom));
        background: var(--zw-bg, #15171c);
        border-top: 1px solid var(--zw-line, #3a4150);
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10; /* modals, popups and overlays sit above the sticky status strip */
      }
      /* Short landscape phone: the strip and bar must not eat the screen. */
      @media (max-height: 500px) {
        #status {
          padding: 3px 6px;
          gap: 2px;
        }
        #bar {
          padding: 4px 6px;
        }
        #app.life #side {
          overflow-y: auto;
        }
        #app.life #status {
          position: static;
        }
        #app.life #sideScroll {
          flex: none;
          overflow: visible;
        }
        #app.life #bar {
          position: static;
        }
        #app.life #side::after {
          display: none;
        }
        @supports (animation-timeline: scroll()) {
          #app.life #side::after {
            display: block;
            margin-top: -30px;
            animation: zw-scroll-more linear both;
            animation-timeline: scroll(nearest);
          }
        }
        /* Coach strip: tighter, the 44px Got it button still sets the height. */
        #coach {
          padding: 0 6px;
        }
        .zw-coach-text {
          font-size: 12px;
          line-height: 1.2;
        }
        /* Bar buttons in one row: End Turn takes the most room, nothing drops under 44px. */
        #bar .zw-endturn {
          flex: 3 1 150px !important;
          min-height: 44px !important;
        }
        #bar .zw-endturn span:first-child {
          font-size: 15px !important;
        }
      }
      /* Zoreo's corner head: the board's upper right; where he looks shows the phase. */
      #zoreo-corner {
        position: absolute;
        z-index: 1;
        top: 6px;
        right: 6px;
        width: 68px;
        height: 76px;
        display: none;
        pointer-events: none;
        transition: top 0.4s ease-in-out;
      }
      #zoreo-corner[data-gaze] {
        display: block;
      }
      #zoreo-corner svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
        transition: transform 0.3s ease-in-out;
      }
      /* Portrait: the panel is below the board, so no flip; he slides down to the lower right. */
      #zoreo-corner[data-gaze="panel"] {
        top: calc(100% - 76px - 6px);
      }
      #zoreo-corner .zo-lid {
        transition: transform 0.08s linear;
      }
      #zoreo-corner.blink .zo-lid {
        transform: none;
      }
      #zoreo-corner[data-calm],
      #zoreo-corner[data-calm] svg,
      #zoreo-corner[data-calm] .zo-lid {
        transition: none;
      }
      /* Wide or landscape: board left, fixed side panel right. */
      @media (min-width: 900px), (min-aspect-ratio: 5/4) {
        #app {
          flex-direction: row;
        }
        #board,
        #app.life #board {
          flex: 1 1 0;
          min-height: 0;
        }
        /* Wide: he stays in the upper right and turns to face the panel on the right. */
        #zoreo-corner,
        #zoreo-corner[data-gaze="panel"] {
          top: 8px;
          width: 100px;
          height: 112px;
        }
        #zoreo-corner[data-gaze="panel"] svg {
          transform: scaleX(-1);
        }
        #side {
          flex: 0 0 clamp(340px, 45vw, 480px);
          border-top: 0;
          border-left: 1px solid var(--zw-line, #3a4150);
        }
      }
      /* Title scene (src/ui/titleScene.ts): a bright decorative layer behind a solid dark card.
         The card's own layout is inline in menu.ts, so the few rules that fight it use !important. */
      .zs-scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        background: radial-gradient(
          120% 80% at 70% 0%,
          #c9fff4 0%,
          #7fe0d2 35%,
          #36b3ae 70%,
          #1f8c8f 100%
        );
      }
      .zs-scene svg {
        display: block;
      }
      .zs-rays {
        position: absolute;
        inset: 0;
        background: repeating-conic-gradient(
          from 200deg at 78% -10%,
          rgba(255, 255, 255, 0.16) 0 6deg,
          rgba(255, 255, 255, 0) 6deg 14deg
        );
        -webkit-mask: linear-gradient(#000, transparent 60%);
        mask: linear-gradient(#000, transparent 60%);
      }
      .zs-bokeh {
        position: absolute;
        inset: 0 0 auto 0;
        width: 100%;
        height: 62%;
      }
      .zs-island {
        position: absolute;
        left: -4%;
        width: 108%;
        bottom: -2%;
        height: 60%;
      }
      .zs-hero {
        position: absolute;
        right: 1vw;
        top: 3vh;
        height: 66vh;
        width: auto;
        overflow: visible;
      }
      .zs-germ {
        position: absolute;
        height: auto;
      }
      .zs-g-asp {
        left: 14vw;
        top: 44vh;
        width: 10.5vw;
      }
      .zs-g-orange {
        left: 1.5vw;
        top: 50vh;
        width: 12vw;
      }
      .zs-g-teal {
        left: 11vw;
        top: 65vh;
        width: 12.5vw;
      }
      .zs-menu {
        align-items: flex-start !important;
        justify-content: flex-start !important;
        padding: 25vh 16px 24px 28vw !important;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif !important;
      }
      .zs-card {
        --zs-card-w: 450px;
        position: relative;
        width: min(100%, var(--zs-card-w)) !important;
        margin: 0 0 auto !important;
        flex-shrink: 0;
        gap: 10px !important;
        padding: 14px 26px 24px;
        border-radius: 30px;
        background: var(--zw-card);
        box-shadow:
          0 0 0 4px var(--zw-card-rim),
          0 0 0 8px rgba(255, 255, 255, 0.55),
          0 14px 0 4px rgba(20, 30, 60, 0.22),
          0 22px 40px rgba(20, 30, 60, 0.35);
      }
      .zs-card > * {
        flex-shrink: 0;
      }
      .zs-card::before {
        content: "";
        position: absolute;
        inset: 6px 14px auto;
        height: 40px;
        border-radius: 24px 24px 60% 60% / 24px 24px 30px 30px;
        background: linear-gradient(
          rgba(255, 255, 255, 0.07),
          rgba(255, 255, 255, 0)
        );
        pointer-events: none;
      }
      .zs-wm {
        margin: -6px -6px 0;
        line-height: 0;
      }
      .zs-wm svg {
        width: 100%;
        height: auto;
      }
      .zs-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .zs-title {
        margin: 0;
        font:
          700 26px/1.2 system-ui,
          sans-serif;
        overflow-wrap: anywhere;
        text-align: center;
      }
      .zs-tag {
        margin: -4px 0 4px;
        font-size: 16px;
        line-height: 1.35;
        text-align: center;
      }
      .zs-card h2 {
        margin: 8px 2px 0;
        font:
          700 15px system-ui,
          sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--zw-text-muted);
      }
      .zs-btn {
        all: unset;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-height: 56px;
        padding: 11px 18px;
        border-radius: 18px;
        cursor: pointer;
        background: linear-gradient(#353c4b, #2d3340);
        color: var(--zw-text);
        box-shadow:
          inset 0 2px 0 rgba(255, 255, 255, 0.08),
          0 0 0 2px #4a5263,
          0 5px 0 2px #10131a;
      }
      .zs-btn .zs-l {
        font:
          700 18px/1.2 system-ui,
          sans-serif;
        overflow-wrap: anywhere;
      }
      .zs-btn .zs-s {
        font-size: 14px;
        line-height: 1.3;
        color: var(--zw-text-muted);
        overflow-wrap: anywhere;
      }
      .zs-btn.zs-primary {
        background: linear-gradient(#cff0ff, var(--zw-primary) 55%, #86c9e8);
        color: var(--zw-primary-ink);
        box-shadow:
          inset 0 3px 0 rgba(255, 255, 255, 0.7),
          0 0 0 2px #2f6a8c,
          0 6px 0 2px #2f6a8c;
      }
      .zs-btn.zs-primary .zs-l {
        font-size: 20px;
      }
      .zs-btn.zs-primary .zs-s {
        color: #1d3a4c;
      }
      .zs-btn.zs-small {
        min-height: 44px;
        padding: 8px 16px;
        background: none;
        box-shadow: inset 0 0 0 2px #4a5263;
      }
      .zs-btn.zs-small .zs-l {
        font-size: 15px;
        font-weight: 600;
      }
      .zs-btn.zs-small .zs-s {
        font-size: 13px;
      }
      .zs-btn.zs-off {
        cursor: default;
        background: none;
        box-shadow: none;
        border: 2px dashed #4a5263;
      }
      .zs-btn.zs-off .zs-l {
        color: var(--zw-text-muted);
        font-weight: 600;
      }
      .zs-btn:focus-visible {
        outline: 3px solid var(--zw-focus);
        outline-offset: 4px;
      }
      /* The title's opening beat and blink (src/ui/titleScene.ts); the still final frame is the default. */
      @keyframes zs-rise {
        from {
          transform: translateY(230px);
        }
        to {
          transform: none;
        }
      }
      @keyframes zs-pop {
        from {
          opacity: 0;
          transform: scale(0.3);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes zs-fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .zs-lid {
        transition: transform 0.08s linear;
      }
      .zs-blink .zs-lid {
        transform: none;
      }
      .zs-play .zs-zoreo {
        animation: zs-rise 0.75s cubic-bezier(0.3, 1.25, 0.5, 1) both;
      }
      .zs-play .zs-buddies {
        animation: zs-fade 0.4s 0.45s both;
      }
      .zs-play .zs-trail {
        animation: zs-fade 0.5s 0.8s both;
      }
      .zs-play .zs-v {
        transform-box: fill-box;
        transform-origin: center;
        animation: zs-pop 0.22s ease-out both;
      }
      .zs-play .zs-v1 {
        animation-delay: 0.8s;
      }
      .zs-play .zs-v2 {
        animation-delay: 0.87s;
      }
      .zs-play .zs-v3 {
        animation-delay: 0.94s;
      }
      .zs-play .zs-v4 {
        animation-delay: 1.01s;
      }
      .zs-play .zs-v5 {
        animation-delay: 1.08s;
      }
      .zs-play .zs-v6 {
        animation-delay: 1.15s;
      }
      .zs-play .zs-v7 {
        animation-delay: 1.22s;
      }
      .zs-play .zs-v8 {
        animation-delay: 1.29s;
      }
      .zs-play .zs-v9 {
        animation-delay: 1.36s;
      }
      /* Phone portrait: the scene is a strip above the card; companions and far volley clumps go. */
      @media (max-aspect-ratio: 1/1) {
        .zs-island {
          left: -70%;
          width: 240%;
          top: 15vh;
          bottom: auto;
          height: auto;
          aspect-ratio: 1600/640;
        }
        .zs-bokeh {
          height: 24%;
        }
        .zs-hero {
          height: 28vh;
          top: 2vh;
          right: -10px;
        }
        .zs-g-asp {
          left: 20vw;
          top: 12vh;
          width: 16vw;
        }
        .zs-g-orange {
          left: 2vw;
          top: 15vh;
          width: 19vw;
        }
        .zs-g-teal,
        .zs-buddies,
        .zs-v6,
        .zs-v7,
        .zs-v8,
        .zs-v9 {
          display: none;
        }
        .zs-menu {
          padding: 30vh 16px 16px !important;
        }
        .zs-card {
          margin: 0 auto auto !important;
        }
      }
      /* Phone landscape: companions go first, then most of the volley, then the staph germ. */
      @media (min-aspect-ratio: 1/1) and (max-height: 520px) {
        .zs-hero {
          height: 84vh;
          top: 6vh;
          right: -14px;
        }
        .zs-buddies,
