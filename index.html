<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zebra Wars</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--zw-bg, #15171c);
        color: var(--zw-text, #e8eaf0);
        font: 14px sans-serif;
      }
      button {
        font: inherit;
        color: var(--zw-text, #e8eaf0);
        background: var(--zw-control, #2d3340);
        border: 1px solid var(--zw-line-strong, #4a5263);
        border-radius: 6px;
      }
      button:hover:not(:disabled) {
        background: var(--zw-control-hover, #3a4150);
      }
      button:disabled {
        opacity: 0.45;
      }
      button:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--zw-focus, #9fd8f0);
        outline-offset: 2px;
      }
      /* Narrow or portrait: board on top, panels below, controls pinned at the bottom. */
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
        height: 100dvh;
      }
      #board {
        position: relative;
        flex: 0 0 48%;
        min-height: 300px;
        min-width: 0;
      }
      /* Life phase: the calendar needs the room, so the body inset shrinks on a phone. */
      #app.life #board {
        flex-basis: 30%;
        min-height: 190px;
      }
      #scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #side {
        flex: 1 1 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: var(--zw-surface, #1f232b);
        border-top: 1px solid var(--zw-line, #3a4150);
      }
      /* Coach strip (Arc 1 only): one line above the status strip; empty means hidden. */
      #coach {
        flex: none;
        z-index: 2;
        box-sizing: border-box;
        padding: 4px 8px;
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--zw-info-bg, #2a3140);
        border-bottom: 1px solid var(--zw-line, #3a4150);
      }
      #coach:empty {
        display: none;
      }
      .zw-coach-text {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 13px;
        line-height: 1.3;
        color: var(--zw-text, #e8eaf0);
      }
      .zw-coach-got {
        flex: none;
        min-width: 44px;
        min-height: 44px;
        padding: 0 10px;
      }
      /* A control the coach points at: a static outline, pulsing only if motion is welcome. */
      .zw-coach-pulse {
        outline: 2px solid var(--zw-focus, #9fd8f0);
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: no-preference) {
        .zw-coach-pulse {
          animation: zw-coach-pulse 1.2s ease-in-out infinite;
        }
      }
      @keyframes zw-coach-pulse {
        50% {
          outline-color: transparent;
          outline-offset: 5px;
        }
      }
      /* Status strip: pinned at the top of the side panel while #sideScroll scrolls; never on the board. */
      #status {
        flex: none;
        position: sticky;
        top: 0;
        z-index: 2;
        padding: 6px 8px;
        background: var(--zw-surface, #1f232b);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #status:empty {
        display: none;
      }
      .zw-status-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
      }
      .zw-status-grid[data-cols="3"] {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      @media (max-width: 339px) {
        .zw-status-grid[data-cols] {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      .zw-cell {
        min-height: 44px;
        min-width: 0;
        box-sizing: border-box;
        padding: 3px 5px 5px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 2px;
        text-align: left;
        background: var(--zw-raised, #272c36);
        border: 1px solid var(--zw-line, #3a4150);
        border-radius: 6px;
      }
      .zw-cell[aria-pressed="true"] {
        border-color: var(--zw-focus, #9fd8f0);
      }
      .zw-cell-label {
        font-size: 12px;
        line-height: 1.2;
        color: var(--zw-text-muted, #a9b0bd);
      }
      .zw-cell-value {
        font-size: 13px;
        line-height: 1.2;
        color: var(--zw-text, #e8eaf0);
      }
      .zw-cell-state {
        font-weight: 600;
      }
      .zw-tip-btn {
        flex: none;
        min-width: 44px;
        min-height: 44px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: 0;
        color: inherit;
        cursor: pointer;
      }
      .zw-tip-dot {
        width: 22px;
        height: 22px;
        box-sizing: border-box;
        border: 1.5px solid var(--zw-text-muted, #a9b0bd);
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 700;
        line-height: 1;
      }
      .zw-tip-btn[aria-expanded="true"] .zw-tip-dot {
        border-color: var(--zw-focus, #9fd8f0);
        background: var(--zw-control, #323846);
      }
      .zw-tip-note {
        font-size: 13px;
        line-height: 1.35;
        padding: 6px 8px;
        border-radius: 6px;
        background: var(--zw-info-bg, #2a3140);
        color: var(--zw-text, #e8eaf0);
      }
      .zw-tip-note[hidden] {
        display: none;
      }
      .zw-bar {
        position: relative;
        flex: none;
        height: 6px;
        border-radius: 3px;
        background: var(--zw-line, #3a4150);
        overflow: hidden;
      }
      .zw-bar-ghost,
      .zw-bar-solid {
        position: absolute;
        inset: 0 auto 0 0;
      }
      .zw-bar-ghost {
        opacity: 0.35;
      }
      .zw-bar-notch {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--zw-text, #e8eaf0);
      }
      .zw-bar-segments {
        display: flex;
        gap: 2px;
        background: none;
        border-radius: 0;
        overflow: visible;
      }
      .zw-seg {
        flex: 1 1 0;
        border-radius: 2px;
        background: var(--zw-line, #3a4150);
      }
      .zw-seg-solid {
        background: var(--zw-seg);
      }
      .zw-seg-ghost {
        background: var(--zw-seg);
        opacity: 0.35;
      }
      .zw-status-info {
        font-size: 13px;
        line-height: 1.3;
        color: var(--zw-text, #e8eaf0);
      }
      #sideScroll {
        flex: 1 1 0;
        min-height: 0;
        overflow-y: auto;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #bar {
        flex: none;
        padding: 8px 8px max(8px, env(safe-area-inset-bottom));
        background: var(--zw-bg, #15171c);
        border-top: 1px solid var(--zw-line, #3a4150);
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10; /* modals, popups and overlays sit above the sticky status strip */
      }
      /* Short landscape phone: the strip and bar must not eat the screen. */
      @media (max-height: 500px) {
        #status {
          padding: 3px 6px;
          gap: 2px;
        }
        #bar {
          padding: 4px 6px;
        }
        #app.life #side {
          overflow-y: auto;
        }
        #app.life #status {
          position: static;
        }
        #app.life #sideScroll {
          flex: none;
          overflow: visible;
        }
        #app.life #bar {
          position: static;
        }
      }
      /* Wide or landscape: board left, fixed side panel right. */
      @media (min-width: 900px), (min-aspect-ratio: 5/4) {
        #app {
          flex-direction: row;
        }
        #board,
        #app.life #board {
          flex: 1 1 0;
          min-height: 0;
        }
        #side {
          flex: 0 0 clamp(300px, 28vw, 360px);
          border-top: 0;
          border-left: 1px solid var(--zw-line, #3a4150);
        }
      }
    </style>
  </head>
  <body>
    <!-- Before #app so the Menu button (the first thing in #ui) leads the tab order; #ui is fixed. -->
    <div id="ui"></div>
    <div id="app">
      <div id="board"><canvas id="scene"></canvas></div>
      <aside id="side" aria-label="Orders and information">
        <div
          id="coach"
          role="status"
          aria-live="polite"
          aria-label="Hint"
        ></div>
        <div id="status"></div>
        <div id="sideScroll"></div>
        <div id="bar"></div>
      </aside>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
