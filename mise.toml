[tools]
node = "26"

[tasks.dev]
description = "Start the Vite dev server on port 5199 (or use pitchfork: daemons.web)"
run = "npm run dev -- --port 5199"

[tasks.build]
description = "Typecheck and build the static bundle into dist/"
run = "npm run build"

[tasks.preview]
description = "Serve the built dist/ locally (run build first)"
run = "npm run preview"

[tasks.test]
description = "Run the Vitest suite once"
run = "npm test"

[tasks.typecheck]
description = "Typecheck the app and the sim project"
run = "npm run typecheck"

[tasks.lint]
description = "ESLint across the tree"
run = "npm run lint"

[tasks."format:check"]
description = "Check formatting with Prettier"
run = "npm run format:check"

[tasks.format]
description = "Reformat the whole tree with Prettier (prefer formatting only files you edited)"
run = "npm run format"

[tasks.check]
description = "Everything CI-like: typecheck, lint, format:check, test, build"
depends = ["typecheck", "lint", "format:check", "test", "build"]
