<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Title scene B</title><style>
:root{--zw-bg:#15171C;--zw-surface:#1F232B;--zw-raised:#272C36;--zw-control:#2D3340;--zw-control-hover:#3A4150;
--zw-line:#3A4150;--zw-line-strong:#4A5263;--zw-text:#E8EAF0;--zw-text-muted:#A9B0BD;--zw-focus:#9FD8F0;--zw-swarm:#9FD8F0;
/* proposed new tokens */--zw-card:#1C1F2A;--zw-card-rim:#5E9A8C;--zw-primary:#9FD8F0;--zw-primary-lip:#3F8DB3;--zw-primary-ink:#15171C}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--zw-bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--zw-text)}
.scene{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.scene svg{display:block}
.scroll{position:fixed;inset:0;overflow:auto;display:flex;align-items:flex-start;padding:var(--pad-t,24px) 16px 24px}
.card{position:relative;margin:auto;width:var(--card-w,440px);max-width:100%;background:var(--zw-card);border-radius:30px;
 padding:14px 26px 24px;display:flex;flex-direction:column;gap:10px;
 box-shadow:0 0 0 4px var(--zw-card-rim),0 0 0 8px rgba(255,255,255,.55),0 14px 0 4px rgba(20,30,60,.22),0 22px 40px rgba(20,30,60,.35)}
.card>*{flex-shrink:0}
.card::before{content:"";position:absolute;inset:6px 14px auto;height:40px;border-radius:24px 24px 60% 60%/24px 24px 30px 30px;
 background:linear-gradient(rgba(255,255,255,.07),rgba(255,255,255,0));pointer-events:none}
.wm{margin:-6px -6px 0;line-height:0}.wm svg{width:100%;height:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tag{margin:-4px 0 4px;font-size:16px;line-height:1.35;text-align:center;color:var(--zw-text)}
h2{margin:8px 2px 0;font:700 15px system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--zw-text-muted)}
.btn{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:2px;min-height:56px;padding:11px 18px;border-radius:18px;cursor:pointer;
 background:linear-gradient(#353C4B,#2D3340);color:var(--zw-text);box-shadow:inset 0 2px 0 rgba(255,255,255,.08),0 0 0 2px #4A5263,0 5px 0 2px #10131A}
.btn .l{font:700 18px/1.2 system-ui,sans-serif}.btn .s{font-size:14px;line-height:1.3;color:var(--zw-text-muted)}
.btn.primary{background:linear-gradient(#CFF0FF,#9FD8F0 55%,#86C9E8);color:var(--zw-primary-ink);
 box-shadow:inset 0 3px 0 rgba(255,255,255,.7),0 0 0 2px #2F6A8C,0 6px 0 2px #2F6A8C}
.btn.primary .l{font-size:20px}.btn.primary .s{color:#1D3A4C}
.btn.small{min-height:44px;padding:8px 16px;background:none;box-shadow:inset 0 0 0 2px #4A5263}
.btn.small .l{font-size:15px;font-weight:600}.btn.small .s{font-size:13px}
.btn.off{cursor:default;background:none;box-shadow:none;border:2px dashed #4A5263}.btn.off .l{color:var(--zw-text-muted);font-weight:600}
.btn:focus-visible{outline:3px solid var(--zw-focus);outline-offset:4px}
.mock-note{display:none}

.scene{background:radial-gradient(120% 80% at 70% 0%,#C9FFF4 0%,#7FE0D2 35%,#36B3AE 70%,#1F8C8F 100%)}
.bokeh{position:absolute;inset:0 0 auto 0;width:100%;height:62%}
.rays{position:absolute;inset:0;background:repeating-conic-gradient(from 200deg at 78% -10%,rgba(255,255,255,.16) 0 6deg,rgba(255,255,255,0) 6deg 14deg);
 -webkit-mask:linear-gradient(#000,transparent 60%);mask:linear-gradient(#000,transparent 60%)}
.island{position:absolute;left:-4%;width:108%;bottom:-2%;height:60%}
.zoreo{position:absolute;right:1vw;top:3vh;height:66vh;width:auto;overflow:visible}
.germ{position:absolute;height:auto}
.g-asp{left:14vw;top:44vh;width:10.5vw}.g-strep{left:1.5vw;top:50vh;width:12vw}.g-staph{left:11vw;top:65vh;width:12.5vw}
.scroll{--card-w:450px;justify-content:flex-start;padding-left:28vw;padding-top:25vh}
.card{margin:0 0 auto;flex-shrink:0}
@media (max-aspect-ratio:1/1){
 .island{left:-70%;width:240%;top:15vh;bottom:auto;height:auto;aspect-ratio:1600/640}
 .bokeh{height:24%}
 .zoreo{height:28vh;top:2vh;right:-10px}
 .g-asp{left:20vw;top:12vh;width:16vw}.g-strep{left:2vw;top:15vh;width:19vw}.g-staph{display:none}
 .zs-buddies,.zs-v6,.zs-v7,.zs-v8,.zs-v9{display:none}
 .scroll{padding:30vh 16px 16px}.card{margin:0 auto auto}
}
@media (min-aspect-ratio:1/1) and (max-height:520px){
 .zoreo{height:84vh;top:6vh;right:-14px}
 .zs-buddies,.zs-v2,.zs-v3,.zs-v4,.zs-v5,.zs-v6,.zs-v7,.zs-v8,.zs-v9,.zs-trail{display:none}
 .g-asp{left:9vw;top:34vh;width:11vw}.g-strep{left:1vw;top:50vh;width:12vw}.g-staph{display:none}
 .scroll{padding:12px 16px 12px 25vw}.card{--card-w:370px;margin:0;padding:8px 18px 16px;gap:8px}
 .wm{margin:-2px 30px 0}.tag{font-size:14px}.btn{min-height:48px;padding:8px 14px}.btn .l{font-size:16px}.btn.primary .l{font-size:17px}
 .island{height:66%}
}
